<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">

    <!-- Background Sky -->
    <rect x="0" y="0" width="900" height="600" fill="#bfe9ff"></rect>

    <!-- Grass -->
    <rect x="0" y="420" width="900" height="180" fill="#8ed081"></rect>

    <!-- Sun -->
    <circle cx="760" cy="90" r="50" fill="#ffd84d" stroke="#f4a300" stroke-width="5"></circle>

    <!-- Sun Rays -->
    <line x1="760" y1="15" x2="760" y2="0" stroke="#f4a300" stroke-width="4"></line>
    <line x1="760" y1="165" x2="760" y2="180" stroke="#f4a300" stroke-width="4"></line>
    <line x1="685" y1="90" x2="670" y2="90" stroke="#f4a300" stroke-width="4"></line>
    <line x1="835" y1="90" x2="850" y2="90" stroke="#f4a300" stroke-width="4"></line>
    <line x1="710" y1="40" x2="697" y2="27" stroke="#f4a300" stroke-width="4"></line>
    <line x1="810" y1="140" x2="823" y2="153" stroke="#f4a300" stroke-width="4"></line>
    <line x1="810" y1="40" x2="823" y2="27" stroke="#f4a300" stroke-width="4"></line>
    <line x1="710" y1="140" x2="697" y2="153" stroke="#f4a300" stroke-width="4"></line>

    <!-- Clouds -->
    <ellipse cx="180" cy="110" rx="50" ry="28" fill="white"></ellipse>
    <ellipse cx="220" cy="100" rx="45" ry="26" fill="white"></ellipse>
    <ellipse cx="255" cy="112" rx="40" ry="24" fill="white"></ellipse>

    <ellipse cx="500" cy="85" rx="55" ry="30" fill="white"></ellipse>
    <ellipse cx="545" cy="78" rx="43" ry="24" fill="white"></ellipse>
    <ellipse cx="580" cy="88" rx="38" ry="22" fill="white"></ellipse>

    <!-- House Body -->
    <rect x="290" y="240" width="320" height="200" rx="6" ry="6" fill="#f2c38b" stroke="#5b3a29" stroke-width="4"></rect>

    <!-- Roof -->
    <polygon points="260,240 450,110 640,240" fill="#b23a48" stroke="#5b1f28" stroke-width="4"></polygon>

    <!-- Chimney -->
    <rect x="525" y="135" width="45" height="90" fill="#8b5a3c" stroke="#4b2d1e" stroke-width="4"></rect>

    <!-- Chimney Smoke -->
    <path d="M550 130 C540 115, 565 105, 552 92 C540 80, 565 70, 555 55" fill="none" stroke="#cccccc" stroke-width="6" stroke-linecap="round"></path>

    <!-- Door -->
    <rect x="418" y="330" width="70" height="110" rx="4" ry="4" fill="#7a4e2d" stroke="#4a2f1a" stroke-width="4"></rect>
    <circle cx="474" cy="388" r="5" fill="#f8d26a"></circle>

    <!-- Window Group -->
    <g fill="#dff6ff" stroke="#234e70" stroke-width="4">

        <!-- Left Window -->
        <g transform="translate(335,285)">
            <rect x="0" y="0" width="65" height="65"></rect>
            <line x1="32.5" y1="0" x2="32.5" y2="65"></line>
            <line x1="0" y1="32.5" x2="65" y2="32.5"></line>
        </g>

        <!-- Right Window -->
        <g transform="translate(500,285)">
            <rect x="0" y="0" width="65" height="65"></rect>
            <line x1="32.5" y1="0" x2="32.5" y2="65"></line>
            <line x1="0" y1="32.5" x2="65" y2="32.5"></line>
        </g>
    </g>

    <!-- Path to House -->
    <path d="M440 440 Q410 500 360 600 L520 600 Q480 500 460 440 Z" fill="#d2b48c" stroke="#b28b67" stroke-width="3"></path>

    <!-- Tree Trunk -->
    <rect x="120" y="320" width="35" height="100" fill="#7a4e2d" stroke="#4a2f1a" stroke-width="3"></rect>

    <!-- Tree Leaves -->
    <circle cx="138" cy="285" r="45" fill="#4caf50"></circle>
    <circle cx="105" cy="305" r="35" fill="#43a047"></circle>
    <circle cx="170" cy="305" r="35" fill="#43a047"></circle>
    <ellipse cx="138" cy="255" rx="42" ry="28" fill="#66bb6a"></ellipse>

    <!-- Bushes -->
    <ellipse cx="690" cy="415" rx="45" ry="20" fill="#4caf50"></ellipse>
    <ellipse cx="730" cy="425" rx="40" ry="18" fill="#43a047"></ellipse>
    <ellipse cx="650" cy="425" rx="38" ry="18" fill="#66bb6a"></ellipse>

    <!-- Pond -->
    <ellipse cx="770" cy="500" rx="70" ry="28" fill="#7fd3ff" stroke="#4aa3d8" stroke-width="3"></ellipse>

    <!-- Fence using polyline -->
    <polyline points="20,450 20,410 50,450 50,410 80,450 80,410 110,450 110,410 140,450 140,410 170,450" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"></polyline>

    <!-- Flowers -->
    <!-- Flower 1 -->
    <line x1="220" y1="470" x2="220" y2="510" stroke="green" stroke-width="4"></line>
    <circle cx="220" cy="460" r="8" fill="pink"></circle>
    <circle cx="210" cy="460" r="8" fill="#ff8cc6"></circle>
    <circle cx="230" cy="460" r="8" fill="#ff8cc6"></circle>
    <circle cx="220" cy="450" r="8" fill="#ff8cc6"></circle>
    <circle cx="220" cy="470" r="8" fill="#ff8cc6"></circle>
    <circle cx="220" cy="460" r="5" fill="gold"></circle>

    <!-- Flower 2 -->
    <line x1="260" y1="480" x2="260" y2="520" stroke="green" stroke-width="4"></line>
    <circle cx="260" cy="470" r="8" fill="#b388ff"></circle>
    <circle cx="250" cy="470" r="8" fill="#a56eff"></circle>
    <circle cx="270" cy="470" r="8" fill="#a56eff"></circle>
    <circle cx="260" cy="460" r="8" fill="#a56eff"></circle>
    <circle cx="260" cy="480" r="8" fill="#a56eff"></circle>
    <circle cx="260" cy="470" r="5" fill="gold"></circle>

    <!-- Flower 3 -->
    <line x1="720" y1="470" x2="720" y2="510" stroke="green" stroke-width="4"></line>
    <circle cx="720" cy="460" r="8" fill="#ffcc80"></circle>
    <circle cx="710" cy="460" r="8" fill="#ffb74d"></circle>
    <circle cx="730" cy="460" r="8" fill="#ffb74d"></circle>
    <circle cx="720" cy="450" r="8" fill="#ffb74d"></circle>
    <circle cx="720" cy="470" r="8" fill="#ffb74d"></circle>
    <circle cx="720" cy="460" r="5" fill="gold"></circle>

    <!-- Bird -->
    <path d="M620 140 Q630 130 640 140 Q650 130 660 140" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"></path>

    <!-- Welcome Sign -->
    <rect x="95" y="460" width="90" height="45" rx="6" ry="6" fill="#deb887" stroke="#6d4c41" stroke-width="3"></rect>
    <line x1="140" y1="505" x2="140" y2="545" stroke="#6d4c41" stroke-width="5"></line>

    <!-- Text -->
    <text x="450" y="55" text-anchor="middle" font-size="30" font-family="Verdana" fill="#1f4e79" font-weight="bold">
        Sunny Garden Cottage
    </text>

    <text x="140" y="488" text-anchor="middle" font-size="14" font-family="Arial" fill="#4a2f1a">
        Welcome
    </text>

</svg>